   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard || Contexta</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://aiwave.pixcelsthemes.com/assets/images/logo/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #0d0d0d;
            color: #ffffff;
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* HEADER */
        .topbar {
            width: 100%;
            padding: 12px 25px;
            background: #121212;
            border-bottom: 1px solid #1f1f1f;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
        }

        .profile-email {
            font-size: 12px;
            opacity: .7;
        }

        /* MAIN WRAPPER */
        .dashboard-wrapper {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        /* WELCOME SECTION */
        .welcome-box {
            background: linear-gradient(135deg, #1b1b1b, #101010);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 0 12px #000;
        }

        .welcome-box h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* STAT CARDS */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            flex: 1;
            background: #151515;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #222;
            text-align: left;
            box-shadow: 0 0 10px #000;
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: .7;
            margin-bottom: 6px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: 600;
        }

        .status-active {
            color: #15b45c;
        }

        .status-inactive {
            color: #ff4444;
        }

        /* ACTIVATION CARD */
        .activation-card {
            background: #141414;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #1f1f1f;
            text-align: center;
            box-shadow: 0 0 15px #000;
            margin-bottom: 25px;
        }

        .activation-card h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .activation-code-display {
            font-size: 22px;
            background: #101010;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #222;
            display: inline-block;
            letter-spacing: 2px;
            margin: 10px 0;
        }

        .copy-btn, .activate-btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            width: 180px;
            font-size: 14px;
            margin: 10px 5px;
        }

        .copy-btn {
            background: #6307d4;
        }

        .copy-btn:hover {
            background: #7519e6;
        }

        .activate-btn {
            background: #15b45c;
            text-decoration: none;
            display: inline-block;
        }

        .activate-btn:hover {
            background: #18c968;
        }

        /* LOADING STATE */
        .loading {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

        .error-message {
            background: #2a1515;
            border: 1px solid #ff4444;
            color: #ff6666;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        @media(max-width: 768px) {
            .stats-row {
                flex-direction: column;
            }
            .profile-img {
                width: 40px;
                height: 40px;
            }
            .copy-btn, .activate-btn {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div id="profileImage" class="profile-img">?</div>
        <div id="profileEmail" class="profile-email">loading...</div>
    </div>

    <div class="dashboard-wrapper">
        
        <div id="loadingState" class="loading">
            <p>Loading your dashboard...</p>
        </div>

        <div id="errorState" class="error-message" style="display:none;">
            <p id="errorText"></p>
        </div>

        <div id="dashboardContent" style="display:none;">
            <div class="welcome-box">
                <h1 id="welcomeName">Welcome!</h1>
                <p>Your dashboard is ready.</p>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <h3>Subscription Status</h3>
                    <p id="statSubscription" class="status-inactive">Inactive</p>
                </div>
                <div class="stat-card">
                    <h3>Activation Code</h3>
                    <p id="statCode">----</p>
                </div>
                <div class="stat-card">
                    <h3>Telegram Linked</h3>
                    <p id="telegramLinked">No</p>
                </div>
            </div>

            <div class="activation-card">
                <h2>Your Activation Code</h2>
                <div id="activationCode" class="activation-code-display">Loading...</div>

                <div>
                    <button class="copy-btn" onclick="copyActivation()">Copy Code</button>
                    <a id="telegramActivate" href="https://t.me/YOUR_BOT_USERNAME" target="_blank">
                        <button class="activate-btn">Activate on Telegram</button>
                    </a>
                </div>
                <p style="margin-top:15px; font-size:14px; opacity:0.7;">
                    Use command: <strong>/activate YOUR_CODE</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Get email from URL parameter or localStorage
        function getUserEmail() {
            const urlParams = new URLSearchParams(window.location.search);
            const emailFromUrl = urlParams.get('email');
            
            if (emailFromUrl) {
                localStorage.setItem('userEmail', emailFromUrl);
                return emailFromUrl;
            }
            
            return localStorage.getItem('userEmail');
        }

        // Load dashboard data
        async function loadDashboard() {
            const email = getUserEmail();
            
            if (!email) {
                showError('No email found. Please sign up first.');
                return;
            }

            try {
                // Fetch user data from n8n webhook
                const response = await fetch(`https://contexta-bot.app.n8n.cloud/webhook/dashboard?email=${encodeURIComponent(email)}`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch dashboard data');
                }
                
                const data = await response.json();
                
                if (data && data.user_email) {
                    displayDashboard(data);
                } else {
                    showError('User not found. Please sign up first.');
                }
            } catch (error) {
                console.error('Dashboard error:', error);
                showError('Failed to load dashboard. Please try again later.');
            }
        }

        // Display dashboard with user data
        function displayDashboard(userData) {
            // Hide loading, show content
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';

            // Set profile info
            const email = userData.user_email;
            const initials = email.substring(0, 2).toUpperCase();
            document.getElementById('profileImage').textContent = initials;
            document.getElementById('profileEmail').textContent = email;

            // Set welcome name
            const userName = email.split('@')[0];
            document.getElementById('welcomeName').textContent = `Welcome, ${userName}!`;

            // Set subscription status
            const isActive = userData.subscription_active;
            const statusElement = document.getElementById('statSubscription');
            statusElement.textContent = isActive ? 'Active' : 'Inactive';
            statusElement.className = isActive ? 'status-active' : 'status-inactive';

            // Set activation code
            const code = userData.access_code || '----';
            document.getElementById('statCode').textContent = code;
            document.getElementById('activationCode').textContent = code;

            // Set Telegram linked status
            const telegramLinked = userData.telegram_chat_id ? 'Yes ✓' : 'No';
            document.getElementById('telegramLinked').textContent = telegramLinked;
            document.getElementById('telegramLinked').style.color = userData.telegram_chat_id ? '#15b45c' : '#ff4444';
        }

        // Show error message
        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        // Copy activation code to clipboard
        function copyActivation() {
            const code = document.getElementById('activationCode').textContent;
            
            if (code === 'Loading...' || code === '----') {
                alert('No activation code available');
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(function() {
                    alert('✓ Activation code copied to clipboard!');
                }).catch(function(err) {
                    console.error('Failed to copy:', err);
                    fallbackCopy(code);
                });
            } else {
                fallbackCopy(code);
            }
        }

        // Fallback copy method
        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                alert('✓ Activation code copied to clipboard!');
            } catch (err) {
                console.error('Fallback copy failed:', err);
                alert('Failed to copy. Code: ' + text);
            }
            
            document.body.removeChild(textArea);
        }

        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
